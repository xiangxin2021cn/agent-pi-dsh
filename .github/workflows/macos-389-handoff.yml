name: Audit 3.8.9 Pages response retries
on:
  push:
    branches: [codex/release-389-intel-handoff]
    paths: [.github/workflows/macos-389-handoff.yml]
permissions:
  contents: read
jobs:
  public-www:
    name: Read back remaining Pages URLs over verified TLS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Compare 23 production responses with the accepted site manifest
        shell: bash
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '1'
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "xiangxin2021cn/agent-pi-dsh"
          test "$GITHUB_REF" = "refs/heads/codex/release-389-intel-handoff"
          node --input-type=module <<'NODE'
          await (async function runAudit(spec) {
            const { default: assert } = await import('node:assert/strict')
            const { createHash } = await import('node:crypto')
            const { writeFileSync } = await import('node:fs')
            const headers = {
              'x-content-type-options': 'nosniff',
              'x-frame-options': 'SAMEORIGIN',
              'referrer-policy': 'strict-origin-when-cross-origin',
            }
            async function check(item) {
              const origin = item.origin ?? spec.origin
              let url = new URL(item.path, origin)
              if (item.cacheKey) url.searchParams.set('v', item.cacheKey)
              const signal = AbortSignal.timeout(35000)
              for (let attempt = 0; attempt < 4; attempt++) {
                const response = await fetch(url, {
                  redirect: 'manual', signal,
                  headers: { 'Cache-Control': 'no-cache', 'Accept-Encoding': 'identity' },
                })
                if ([301, 302, 303, 307, 308].includes(response.status)) {
                  await response.body?.cancel()
                  const location = response.headers.get('location')
                  assert.ok(location, 'Redirect has no Location')
                  const target = new URL(location, url)
                  assert.equal(target.origin, origin, 'Redirect left the production origin')
                  assert.ok(!target.username && !target.password, 'Redirect contained credentials')
                  url = target
                  continue
                }
                if (response.status !== 200) {
                  await response.body?.cancel()
                  throw new Error('HTTP ' + response.status)
                }
                assert.ok(response.body, 'Response has no body')
                const reader = response.body.getReader()
                let bytes = 0
                const hash = createHash('sha256')
                try {
                  for (;;) {
                    const chunk = await reader.read()
                    if (chunk.done) break
                    bytes += chunk.value.byteLength
                    assert.ok(bytes <= item.bytes, 'Response exceeded manifest bytes')
                    hash.update(chunk.value)
                  }
                } finally {
                  await reader.cancel().catch(() => {})
                }
                assert.equal(bytes, item.bytes, 'Response byte count differs')
                const sha256 = hash.digest('hex')
                assert.equal(sha256, item.sha256, 'Response SHA-256 differs')
                const receivedHeaders = {}
                for (const [name, expected] of Object.entries(headers)) {
                  receivedHeaders[name] = response.headers.get(name)
                  assert.equal(receivedHeaders[name], expected, 'Unexpected ' + name)
                }
                return { finalPath: url.pathname + url.search, bytes, sha256, headers: receivedHeaders }
              }
              throw new Error('Too many redirects')
            }
          
            const rows = Array(spec.checks.length)
            let next = 0
            await Promise.all(Array.from({ length: 4 }, async () => {
              while (next < spec.checks.length) {
                const index = next++
                const item = spec.checks[index]
                const row = { origin: item.origin ?? spec.origin, path: item.path, cacheKey: item.cacheKey ?? null }
                try {
                  rows[index] = { ...row, ...await check(item), accepted: true }
                } catch (error) {
                  rows[index] = { ...row, accepted: false, error: error.message }
                }
              }
            }))
            const accepted = rows.filter(row => row.accepted).length
            const status = accepted === rows.length ? 'passed' : 'failed'
            const { checks, ...identity } = spec
            const report = {
              ...identity, status, requested: rows.length, accepted, verifiedAt: new Date().toISOString(),
              runId: process.env.GITHUB_RUN_ID, workflowCommit: process.env.GITHUB_SHA, rows,
            }
            writeFileSync(spec.reportFile, JSON.stringify(report, null, 2) + '\n', { flag: 'wx' })
            console.log(JSON.stringify({ status, siteCommit: spec.siteCommit, deploymentId: spec.deploymentId, accepted, requested: rows.length }))
            if (status !== 'passed') process.exitCode = 1
          })({"origin":null,"reportFile":"pages-supplemental-readback.json","siteCommit":"b57a82be2edf0e52ce41f3f3d6df70f413749d24","deploymentId":"c9c89e78-5bb0-4549-95b8-da802b4fa49f","manifestSha256":"1ed8eb70e5d90c6bb9b9df19658269448fb79626d4c0d2ad2b87f2f53ef7e7c9","checks":[{"path":"/assets/img/A_premium_dark_abstract_hero_b_2026-08-23T16-59-49.png","origin":"https://c9c89e78.agent-pi.pages.dev","cacheKey":"389-sync-final","bytes":1267483,"sha256":"6bebaf065c40253ac873f0d447613677c464be0e1375794aa5736b3a8b0d635d"},{"path":"/assets/img/PROMPTS.md","origin":"https://c9c89e78.agent-pi.pages.dev","cacheKey":"389-sync-final","bytes":10474,"sha256":"8780627753d5602dadd67698fe1402d6519acbe5a426114c8eb899290867599f"},{"path":"/assets/img/A_premium_light_abstract_hero__2026-08-23T16-59-49.png","origin":"https://c9c89e78.agent-pi.pages.dev","cacheKey":"389-sync-final","bytes":1262498,"sha256":"e373493b11949ee510216a25d4043ba31454ee4cd29b7f63e254bb580a09533b"},{"path":"/assets/img/hero-dark-v2.jpg","origin":"https://c9c89e78.agent-pi.pages.dev","cacheKey":"389-sync-final","bytes":80198,"sha256":"cd3333eff46346b750b02f6877847e651c660d5f53addae792616ab692d5a001"},{"path":"/assets/img/hero-logo.png","origin":"https://c9c89e78.agent-pi.pages.dev","cacheKey":"389-sync-final","bytes":244530,"sha256":"e2a2ae18e61e1ea5baae3c9693de35a96413d7e36890704d7ba8071f7d832dd2"},{"path":"/assets/img/logo.png","origin":"https://c9c89e78.agent-pi.pages.dev","cacheKey":"389-sync-final","bytes":55372,"sha256":"8e56bf2b2f8e274a8388bd600bb03c52056848764ea817a278b2012479c0878a"},{"path":"/assets/img/screenshot-market.png","origin":"https://c9c89e78.agent-pi.pages.dev","cacheKey":"389-sync-final","bytes":140137,"sha256":"a9fc243ec5e1b95266a14a7ae21e8f62bc25e349648cfb865a7247cbc2dbaa7d"},{"path":"/assets/img/showcase/report-map.png","origin":"https://c9c89e78.agent-pi.pages.dev","cacheKey":"389-sync-final","bytes":330021,"sha256":"6d03038870f44a8530c8ddcbdd0e66699c32ac2e759fce060ecb39cd3f70bdd6"},{"