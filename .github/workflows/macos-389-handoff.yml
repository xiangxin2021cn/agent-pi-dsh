name: 3.8.9 Apple Silicon native acceptance
on:
  push:
    branches:
      - codex/release-389-intel-handoff
    paths:
      - .github/workflows/macos-389-handoff.yml
permissions:
  contents: read
env:
  RELEASE_TAG: v3.8.9
  NODE_RUNTIME_VERSION: 24.22.2
  V389_PAYLOAD_SHA256: 3b05dedbe9871993067cf5f2a98af5fece9d7c2c8d1db662fffb837e19a83659
jobs:
  verify-apple-silicon:
    name: Verify signed arm64 distributables
    runs-on: xcode-27
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fb4ca21ce50d9a06c5f41a1311bedef0f62113f8
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable application source and draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "xiangxin2021cn/agent-pi-dsh"
          test "$GITHUB_REF" = "refs/heads/codex/release-389-intel-handoff"
          test "$(uname -m)" = "arm64"
          test "$(git rev-parse HEAD)" = "fb4ca21ce50d9a06c5f41a1311bedef0f62113f8"
          test "$(git rev-parse refs/tags/v3.8.9^{commit})" = "c71c4f90bb51a4e7ac4892e464affc9dd6420417"
          git merge-base --is-ancestor "c71c4f90bb51a4e7ac4892e464affc9dd6420417" HEAD
          gh api "repos/$GITHUB_REPOSITORY/releases/433638305" > draft.json
          jq -e --arg source "c71c4f90bb51a4e7ac4892e464affc9dd6420417" '(.id == 433638305) and (.draft == true) and (.prerelease == false) and (.tag_name == "v3.8.9") and (.target_commitish == $source)' draft.json > /dev/null
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.2
      - name: Download and match the exact staged signed files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d . -f 1)" = 27
          gh api "repos/$GITHUB_REPOSITORY/releases/439745663" > "qa.json"
          jq -e '(.id == 439745663) and (.draft == true) and (.prerelease == false) and (.tag_name == "qa-macos-389-local-signing") and (.target_commitish == "c71c4f90bb51a4e7ac4892e464affc9dd6420417")' qa.json > /dev/null
          mkdir -p verified
          cd verified
          jq -e '[.assets[] | select(.id == 729308306 and .name == "Agent-Pi-DSH-3.8.9-mac-arm64.dmg" and .size == 687563195 and .state == "uploaded" and .digest == "sha256:8e05061bfc016b3bb580579f48f5413e580b39fd010bc5cbb3e07e723e727b1e")] | length == 1' ../qa.json > /dev/null
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/729308306" > "Agent-Pi-DSH-3.8.9-mac-arm64.dmg"
          printf "%s  %s\n" "8e05061bfc016b3bb580579f48f5413e580b39fd010bc5cbb3e07e723e727b1e" "Agent-Pi-DSH-3.8.9-mac-arm64.dmg" | shasum -a 256 -c -
          jq -e '[.assets[] | select(.id == 729365015 and .name == "Agent-Pi-DSH-3.8.9-mac-arm64.dmg.sha256" and .size == 99 and .state == "uploaded" and .digest == "sha256:a426539075c30f43a49ede770b1fdcbe4f2b21d80616d28a5ef85a45dd5316ff")] | length == 1' ../qa.json > /dev/null
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/729365015" > "Agent-Pi-DSH-3.8.9-mac-arm64.dmg.sha256"
          printf "%s  %s\n" "a426539075c30f43a49ede770b1fdcbe4f2b21d80616d28a5ef85a45dd5316ff" "Agent-Pi-DSH-3.8.9-mac-arm64.dmg.sha256" | shasum -a 256 -c -
          jq -e '[.assets[] | select(.id == 729394556 and .name == "Agent-Pi-DSH-3.8.9-mac-arm64.zip" and .size == 701294351 and .state == "uploaded" and .digest == "sha256:6542810139d5dc6e0e1638af36fba67999d760f9504fb89752dfdd66f22469cb")] | length == 1' ../qa.json > /dev/null
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/729394556" > "Agent-Pi-DSH-3.8.9-mac-arm64.zip"
          printf "%s  %s\n" "6542810139d5dc6e0e1638af36fba67999d760f9504fb89752dfdd66f22469cb" "Agent-Pi-DSH-3.8.9-mac-arm64.zip" | shasum -a 256 -c -
          jq -e '[.assets[] | select(.id == 729435702 and .name == "Agent-Pi-DSH-3.8.9-mac-arm64.zip.sha256" and .size == 99 and .state == "uploaded" and .digest == "sha256:a1f391fcca7cf8cdc33443eaa67d39ff92207853fc0ff21b354c47b5ee4f47ee")] | length == 1' ../qa.json > /dev/null
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/729435702" > "Agent-Pi-DSH-3.8.9-mac-arm64.zip.sha256"
          printf "%s  %s\n" "a1f391fcca7cf8cdc33443eaa67d39ff92207853fc0ff21b354c47b5ee4f47ee" "Agent-Pi-DSH-3.8.9-mac-arm64.zip.sha256" | shasum -a 256 -c -
          test "$(cat "Agent-Pi-DSH-3.8.9-mac-arm64.dmg.sha256")" = "8e05061bfc016b3bb580579f48f5413e580b39fd010bc5cbb3e07e723e727b1e  Agent-Pi-DSH-3.8.9-mac-arm64.dmg"
          test "$(cat "Agent-Pi-DSH-3.8.9-mac-arm64.zip.sha256")" = "6542810139d5dc6e0e1638af36fba67999d760f9504fb89752dfdd66f22469cb  Agent-Pi-DSH-3.8.9-mac-arm64.zip"
      - name: Verify Developer ID, notarization, native runtime and cold start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified/unpacked
          ditto -x -k "verified/Agent-Pi-DSH-3.8.9-mac-arm64.zip" verified/unpacked
          app="$PWD/verified/unpacked/Agent Pi DSH.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = 3.8.9
          test "$(lipo -archs "$app/Contents/MacOS/Agent Pi DSH")" = "arm64"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 -R='anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$app"
          xcrun stapler validate "$app"
          syspolicy_check distribution "$app"
          python3 scripts/verify-macos-intel.py "$app" --arch "arm64" --maximum-macos 15.0.0 --report verified/deployment-targets.json
          node scripts/smoke-macos-intel.mjs "$app" "arm64" 24.22.2 45.2.2
          codesign --verify --deep --strict "$app"
          codesign --verify --strict --verbose=2 -R='anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "verified/Agent-Pi-DSH-3.8.9-mac-arm64.dmg"
          bash scripts/verify-macos-release-dmg.sh "verified/Agent-Pi-DSH-3.8.9-mac-arm64.dmg" 3.8.9 "arm64" 24.22.2 45.2.2 signed "$app"
          { sw_vers; uname -m; cat "verified/Agent-Pi-DSH-3.8.9-mac-arm64.dmg.sha256" "verified/Agent-Pi-DSH-3.8.9-mac-arm64.zip.sha256"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Smoke test the bundled SQLite JDBC runtime
        shell: bash
        run: |
          set -euo pipefail
          product="$PWD/verified/unpacked/Agent Pi DSH.app/Contents/Resources/runtime/product"
          node "$product/scripts/verify-project-plan-runtime.mjs" "$product"
          plan="$product/bundles/project-plan/runtime"
          scratch=$(mktemp -d "$RUNNER_TEMP/agent-pi-sqlite.XXXXXX")
          unzip -p "$plan/lib/sqlite-jdbc-3.51.2.0.jar" "org/sqlite/native/Mac/aarch64/libsqlitejdbc.dylib" > "$scratch/libsqlitejdbc.dylib"
          test "$(lipo -archs "$scratch/libsqlitejdbc.dylib")" = "arm64"
          codesign --verify --strict -R='anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$scratch/libsqlitejdbc.dylib"
          cat > "$scratch/SqliteProbe.java" <<'JAVA'
          import java.sql.DriverManager;
          public class SqliteProbe {
            public static void main(String[] args) throws Exception {
              try (var connection = DriverManager.getConnection("jdbc:sqlite::memory:");
                   var statement = connection.createStatement()) {
                statement.executeUpdate("CREATE TABLE probe (value INTEGER)");
                statement.executeUpdate("INSERT INTO probe VALUES (389)");
                try (var result = statement.executeQuery("SELECT value FROM probe")) {
                  if (!result.next() || result.getInt(1) != 389) throw new IllegalStateException("SQLite round trip failed");
                }
              }
              System.out.println("Bundled SQLite JDBC write/read verified");
            }
          }
          JAVA
          javac --release 17 -d "$scratch" "$scratch/SqliteProbe.java"
          "$plan/jre/bin/java" -Djava.io.tmpdir="$scratch" -cp "$scratch:$plan/lib/*" SqliteProbe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-macos-389-arm64-macos27-acceptance
          path: |-
            verified/*.sha256
            verified/deployment-targets.json
          if-no-files-found: error
          retention-days: 14
