# Builds macOS / Linux desktop packages from the runtime payload attached to a
# GitHub release. The repository pins the official DSH release plus the Agent Pi
# migration; the payload (runtime-payload-<version>.tar.gz, uploaded from the Windows build
# machine by scripts/pack-runtime-payload.mjs) carries everything needed:
# the Electron shell, the product trees, and the DeepSeek Harness source with
# built lib/ + web dist. Each runner installs platform-correct dependencies
# (pnpm --prod), rebuilds native modules for the packaged Node ABI, stages
# the runtime, and lets electron-builder produce native packages.
name: build-desktop-assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag that holds runtime-payload-*.tar.gz (e.g. v3.1.0)'
        required: true
        type: string

      assemble_windows:
        description: Restore a locally verified Windows installer from draft release parts
        required: false
        default: false
        type: boolean

      macos_only:
        description: Build only the two Mac packages from the unchanged release payload
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_RUNTIME_VERSION: '24.22.1'
  RELEASE_TAG: ${{ inputs.tag }}
  V385_PAYLOAD_SHA256: '96e823b93395a1c64a5d49aa1153869485f5b5c3069365f9a6256f61b26e2765'

jobs:
  platform-matrix:
    if: ${{ !inputs.assemble_windows }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select platform jobs
        id: matrix
        env:
          MACOS_ONLY: ${{ inputs.macos_only }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          const include = [
            { os: 'ubuntu-latest', name: 'linux-x64', platform: 'linux', arch: 'x64', node_dist: 'linux-x64', node_ext: 'tar.xz' },
            { os: 'macos-15', name: 'mac-arm64', platform: 'mac', arch: 'arm64', minimum_macos: '15.0.0', node_dist: 'darwin-arm64', node_ext: 'tar.gz' },
            { os: 'macos-15-intel', name: 'mac-x64', platform: 'mac', arch: 'x64', minimum_macos: '15.0.0', node_dist: 'darwin-x64', node_ext: 'tar.gz' },
          ].filter(job => process.env.MACOS_ONLY !== 'true' || job.platform === 'mac')
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`)
          NODE

  build:
    if: ${{ !inputs.assemble_windows }}
    needs: platform-matrix
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_RUNTIME_VERSION: ${{ inputs.tag == 'v3.8.7' && '24.22.2' || '24.22.1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag == 'v3.8.7' && inputs.tag || github.sha }}

      - name: Verify immutable release ref
        shell: bash
        env:
          MACOS_ONLY: ${{ inputs.macos_only }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          CHECKOUT_COMMIT=$(git rev-parse HEAD)
          export RELEASE_COMMIT CHECKOUT_COMMIT
          git diff --name-only --no-renames -z "$RELEASE_COMMIT" HEAD -- > maintenance-changes.paths
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            if [ "$RELEASE_TAG" = v3.8.7 ]; then
              git merge-base --is-ancestor "$RELEASE_COMMIT" "$GITHUB_SHA"
              git diff --name-status --no-renames -z "$RELEASE_COMMIT" "$GITHUB_SHA" -- > maintenance-changes-387.paths
            else
              git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
            fi
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const tag = process.env.RELEASE_TAG
          assert.match(tag, /^v\d+\.\d+\.\d+$/)
          if (tag === 'v3.8.7') {
            const source = '63815f174216f3d41a26b1c31516bc554400c5e1'
            assert.equal(process.env.RELEASE_COMMIT, source, '3.8.7 application tag is immutable')
            assert.equal(process.env.CHECKOUT_COMMIT, source, 'build scripts must come from the exact application tag')
            assert.equal(process.env.NODE_RUNTIME_VERSION, '24.22.2')
            if (process.env.GITHUB_REF_TYPE === 'tag') {
              assert.equal(process.env.GITHUB_REF_NAME, tag)
              assert.equal(process.env.GITHUB_SHA, source)
            } else {
              assert.equal(process.env.GITHUB_REF_TYPE, 'branch')
              assert.equal(process.env.GITHUB_REF_NAME, 'main')
              assert.deepEqual(readFileSync('maintenance-changes-387.paths', 'utf8').split('\0').filter(Boolean),
                ['M', '.github/workflows/build-desktop-assets.yml'], '3.8.7 maintenance may only modify the existing workflow')
            }
            process.exit(0)
          }
          assert.equal(process.env.CHECKOUT_COMMIT, process.env.GITHUB_SHA, 'checkout must be the dispatched workflow commit')
          if (tag === 'v3.8.5') assert.equal(process.env.RELEASE_COMMIT, 'd8b8e6d1a55ff3e383b340f09cca44d2e38478cf', 'v3.8.5 application source is immutable')
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF_NAME, tag)
            assert.equal(process.env.GITHUB_SHA, process.env.RELEASE_COMMIT)
          } else {
            assert.equal(process.env.GITHUB_REF_TYPE, 'branch')
            assert.equal(process.env.GITHUB_REF_NAME, 'main')
            assert.equal(tag, 'v3.8.5')
            assert.equal(process.env.MACOS_ONLY, 'true', 'maintenance dispatch must exclude the completed Linux job')
            const allowed = new Set([
              '.github/workflows/build-desktop-assets.yml',
              'scripts/verify-macos-intel.py',
              'scripts/tests/test_verify_macos_intel.py',
              'scripts/platform-release-385.test.mjs',
              'release/publish-v3.8.5-release.mjs',
              'release/RELEASE_POLICY.md',
              'release/github-notes-3.8.5.md',
              'README.md',
              'website/assets/js/main.js',
              'website/tests/downloads.test.mjs',
              'website/index.html',
            ])
            const changed = readFileSync('maintenance-changes.paths', 'utf8').split('\0').filter(Boolean)
            for (const path of changed) assert.ok(allowed.has(path), `application source changed after the release: ${path}`)
          }
          NODE

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_RUNTIME_VERSION }}

      - name: Download and verify release inputs
        run: |
          mkdir -p release-inputs
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "runtime-payload-*.tar.gz" \
            --pattern "runtime-payload-*.tar.gz.sha256" \
            --pattern "Agent-Pi-DSH-*-CAD-corresponding-source.tar.gz" \
            --pattern "Agent-Pi-DSH-*-CAD-corresponding-source.tar.gz.sha256" \
            --dir release-inputs
          version="${{ inputs.tag }}"
          version="${version#v}"
          test -f "release-inputs/runtime-payload-${version}.tar.gz"
          test -f "release-inputs/runtime-payload-${version}.tar.gz.sha256"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync, readdirSync } from 'node:fs'
          import { join } from 'node:path'
          for (const checksum of readdirSync('release-inputs').filter(name => name.endsWith('.sha256'))) {
            const match = readFileSync(join('release-inputs', checksum), 'utf8').trim().match(/^([a-f0-9]{64})  ([^\\/]+)$/)
            assert.ok(match, `malformed ${checksum}`)
            const actual = createHash('sha256').update(readFileSync(join('release-inputs', match[2]))).digest('hex')
            assert.equal(actual, match[1], `SHA256 mismatch for ${match[2]}`)
            if (match[2] === 'runtime-payload-3.8.5.tar.gz') {
              assert.equal(actual, process.env.V385_PAYLOAD_SHA256, 'v3.8.5 payload differs from its fixed release input')
            }
          }
          NODE
          mkdir -p payload
          tar -xzf release-inputs/runtime-payload-*.tar.gz -C payload
          ls payload

      - name: Verify clean CAD runtime against corresponding source
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          cad_source=$(node -p "require('./payload/product/scripts/cad-clean-pins.json').sourceArchive")
          node payload/product/scripts/cad-clean-release.mjs verify \
            --archive "release-inputs/${cad_source}" \
            --checksum "release-inputs/${cad_source}.sha256" \
            --runtime-dir payload/product/bundles/tender-web/lib/cad-viewer

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          manager=$(node -p "require('./payload/deepseek-harness/package.json').packageManager")
          corepack prepare "$manager" --activate
          test "pnpm@$(pnpm --version)" = "$manager"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare local project plan engine for this platform
        run: |
          node payload/product/scripts/verify-project-plan-runtime.mjs payload/product --portable
          node payload/product/scripts/build-project-plan.mjs --runtime-only
          node payload/product/scripts/verify-project-plan-runtime.mjs payload/product
          node --test payload/product/scripts/project-plan.test.mjs

      - name: Install DSH production dependencies
        working-directory: payload/deepseek-harness
        run: |
          # --ignore-scripts: the repo postinstall imports a devDependency
          # (lefthook) that --prod does not install. Native modules that need
          # a local build are rebuilt explicitly below.
          pnpm install --prod --frozen-lockfile --ignore-scripts

      - name: Rebuild DSH native modules for the packaged Node ABI
        working-directory: payload/deepseek-harness
        run: |
          pnpm --recursive rebuild node-pty koffi
          node --experimental-strip-types native/system/scripts/build.ts --host-addon-only
          node packages/subprocess/subprocess-local/scripts/ensure-spawn-helper.mjs

      - name: Install bundle dependencies
        run: |
          (cd payload/product/packages/business-core && npm ci --omit=dev --no-fund --no-audit)
          (cd payload/product/bundles/tender-host && npm ci --omit=dev --no-fund --no-audit)
          rm payload/product/bundles/tender-host/node_modules/@mlightcad/libredwg-web/wasm/libredwg-web.wasm
          rm payload/product/bundles/tender-host/node_modules/@mlightcad/libredwg-converter/dist/libredwg-web.wasm
          node payload/product/scripts/install-univer-runtime-deps.mjs payload/product/vendor/dsh-univer-office
          node payload/product/scripts/univer-public-release.mjs assert-tree payload/product

      - name: Download Node runtime binary
        run: |
          archive="node-v${NODE_RUNTIME_VERSION}-${{ matrix.node_dist }}.${{ matrix.node_ext }}"
          curl -fsSL "https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}/${archive}" -o node-runtime.archive
          curl -fsSL "https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}/SHASUMS256.txt" -o node-runtime.SHASUMS256.txt
          node --input-type=module - "$archive" <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          const matches = readFileSync('node-runtime.SHASUMS256.txt', 'utf8').split(/\r?\n/)
            .map(line => line.match(/^([a-f0-9]{64})\s+(.+)$/)).filter(match => match?.[2] === process.argv[2])
          assert.equal(matches.length, 1, 'official Node archive checksum must be unique')
          assert.equal(createHash('sha256').update(readFileSync('node-runtime.archive')).digest('hex'), matches[0][1])
          NODE
          mkdir -p node-runtime
          tar -xf node-runtime.archive -C node-runtime --strip-components=1
          node-runtime/bin/node --version
          node-runtime/bin/node payload/product/scripts/install-univer-runtime-deps.mjs payload/product/vendor/dsh-univer-office --verify-only

      - name: Prepare pinned pnpm for the installed app
        run: |
          version=$(node -p "require('./payload/deepseek-harness/package.json').packageManager.replace(/^pnpm@/, '')")
          mkdir -p verified-pnpm
          npm pack "pnpm@${version}" --ignore-scripts --pack-destination verified-pnpm --json > verified-pnpm/pack.json
          node --input-type=module - "$version" <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          const version = process.argv[2]
          assert.match(version, /^\d+\.\d+\.\d+$/)
          const key = `  pnpm@${version}:`
          const lines = readFileSync('payload/deepseek-harness/pnpm-lock.yaml', 'utf8').split(/\r?\n/)
          const entries = lines.map((line, index) => ({ line, index })).filter(({ line }) => line === key)
          assert.equal(entries.length, 1, 'expected one exact pnpm package resolution in the official DSH lock')
          const integrity = lines[entries[0].index + 1].match(/^    resolution: \{integrity: (sha512-[A-Za-z0-9+/=]+)\}$/)?.[1]
          assert.ok(integrity, 'official DSH lock must pin pnpm integrity')
          const [packed] = JSON.parse(readFileSync('verified-pnpm/pack.json', 'utf8'))
          assert.equal(packed.filename, `pnpm-${version}.tgz`)
          assert.equal(`sha512-${createHash('sha512').update(readFileSync(`verified-pnpm/${packed.filename}`)).digest('base64')}`, integrity)
          NODE
          tar -xzf "verified-pnpm/pnpm-${version}.tgz" -C verified-pnpm

      - name: Verify DSH session native modules with packaged Node
        run: |
          node-runtime/bin/node payload/product/scripts/verify-dsh-runtime.mjs \
            payload/deepseek-harness payload/product --native

      - name: Verify terminal native module with packaged Node
        run: |
          node-runtime/bin/node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'
          const require = createRequire(`${process.cwd()}/payload/deepseek-harness/packages/subprocess/subprocess-local/package.json`)
          const terminal = require('node-pty').spawn('/bin/sh', ['-c', 'printf agent-pi-native-ok'])
          let output = ''
          terminal.onData((data) => { output += data })
          const timeout = setTimeout(() => { terminal.kill(); process.exit(1) }, 10000)
          terminal.onExit(({ exitCode }) => {
            clearTimeout(timeout)
            if (exitCode !== 0 || !output.includes('agent-pi-native-ok')) process.exit(1)
            console.log('terminal native module verified')
          })
          NODE

      - name: Stage runtime
        run: |
          node payload/product/scripts/prepare-runtime.mjs \
            --dsh payload/deepseek-harness \
            --product payload/product \
            --node-dir node-runtime \
            --pnpm-dir verified-pnpm/package \
            --out payload/desktop/runtime
          payload/desktop/runtime/node/node payload/desktop/runtime/product/scripts/verify-dsh-runtime.mjs \
            payload/desktop/runtime/deepseek-harness payload/desktop/runtime/product --native

      - name: Install desktop shell dependencies
        working-directory: payload/desktop
        run: |
          npm ci --no-fund --no-audit
          # package.json pins electronDist to node_modules/electron/dist.
          # npm install on CI often skips the Electron zip (run 32699235307
          # added 284 packages in 7s and left dist/ missing). Force it.
          node node_modules/electron/install.js
          test -d node_modules/electron/dist

      - name: Build desktop package
        working-directory: payload/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # --publish never: GH_TOKEN in the environment flips electron-builder
        # into publish mode, which fails because the payload is not a git repo.
        run: |
          if [ "${{ matrix.platform }}" = mac ]; then
            npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.mac.minimumSystemVersion=${{ matrix.minimum_macos }}
          else
            npx electron-builder --linux AppImage deb --x64 --publish never \
              --config.appImage.artifactName='Agent-Pi-DSH-${version}-linux-x86_64.${ext}' \
              --config.deb.artifactName='Agent-Pi-DSH-${version}-linux-amd64.${ext}'
          fi

      - name: Verify macOS packaged deployment targets
        if: matrix.platform == 'mac'
        run: |
          if [ "${{ matrix.arch }}" = arm64 ]; then
            app_dir=mac-arm64
            binary_arch=arm64
          else
            app_dir=mac
            binary_arch=x86_64
          fi
          python3 scripts/verify-macos-intel.py \
            "payload/desktop/dist-unpacked/${app_dir}/Agent Pi DSH.app" \
            --arch "$binary_arch" \
            --maximum-macos "${{ matrix.minimum_macos }}" \
            --report "385-${{ matrix.name }}-scan.json"

      - name: Preserve macOS deployment target diagnostics
        if: always() && matrix.platform == 'mac'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}-deployment-targets
          path: 385-${{ matrix.name }}-scan.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release assets
        run: |
          shopt -s nullglob
          assets=(
            payload/desktop/dist-unpacked/*.AppImage
            payload/desktop/dist-unpacked/*.deb
            payload/desktop/dist-unpacked/*.dmg
            payload/desktop/dist-unpacked/*-mac-*.zip
          )
          if [ ${#assets[@]} -ne 2 ]; then
            echo "expected exactly two ${{ matrix.platform }} assets, found ${#assets[@]}" >&2
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          checksum_assets=()
          for asset in "${assets[@]}"; do
            node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),path=require("node:path"); const file=process.argv[1]; const digest=crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex"); fs.writeFileSync(file+".sha256", digest+"  "+path.basename(file)+"\n");' "$asset"
            checksum_assets+=("${asset}.sha256")
          done
          gh release upload "${{ inputs.tag }}" "${assets[@]}" "${checksum_assets[@]}" \
            --repo "${{ github.repository }}"

  assemble-windows:
    if: ${{ inputs.assemble_windows }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: scripts/assemble-release-parts.mjs
          sparse-checkout-cone-mode: false
      - name: Restore and verify original Windows installer
        run: node scripts/assemble-release-parts.mjs
