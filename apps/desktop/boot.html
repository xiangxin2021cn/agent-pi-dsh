<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Agent Pi DSH</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #eef2f6;
      color: #1a2332;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      box-sizing: border-box;
    }
    .logos {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .company {
      height: 42px;
      width: auto;
      max-width: min(520px, 86vw);
      object-fit: contain;
    }
    .app-logo {
      display: block;
      width: min(320px, 64vw);
      height: auto;
      background: transparent;
    }
    .t {
      font-size: 22px;
      letter-spacing: 0.06em;
      font-weight: 650;
    }
    .n {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #4b5b70;
    }
    .s {
      font-size: 13px;
      color: #5c6b7e;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logos">
      <img class="company" src="./brand/company.png" alt="中国建筑第二工程局有限公司">
      <img class="app-logo" src="./brand/app-logo.png" alt="Agent Pi DSH">
    </div>
    <div class="t">Agent Pi DSH</div>
    <div class="n">DeepSeek Harness</div>
    <div class="s" id="status">正在启动工作台…</div>
  </div>
</body>
</html>
